
version: 2

models:

# imported dbt_utils package in order to use regex
# bundle_offers
  - name: dim_bundle_offers
    columns:
      - name: bundle_id
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['BND-01', 'BND-02', 'BND-03', 'BND-04', 'BND-05']


# bundle_requirements (bridge table)
  - name: bridge_bundle_requirements
    columns:
      - name: bundle_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BND-01', 'BND-02', 'BND-03', 'BND-04', 'BND-05']

      - name: product_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SVC-01', 'SVC-02', 'SVC-03', 'SVC-04',
                         'SVC-05', 'SVC-06', 'SVC-07', 'SVC-08']

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - bundle_id
              - product_id

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (bundle_id, product_id) IN (
                ('BND-01', 'SVC-01'),
                ('BND-01', 'SVC-02'),
                ('BND-02', 'SVC-04'),
                ('BND-03', 'SVC-03'),
                ('BND-04', 'SVC-01'),
                ('BND-04', 'SVC-02'),
                ('BND-04', 'SVC-03'),
                ('BND-05', 'SVC-04'),
                ('BND-05', 'SVC-07')
              )


# customers
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: market_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MKT-01', 'MKT-02', 'MKT-03', 'MKT-04',
                         'MKT-05', 'MKT-06', 'MKT-07', 'MKT-08']

      - name: autopay_enabled
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  LOWER(autopay_enabled) IN ('y', 'n')

      - name: credit_class
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  LOWER(credit_class) IN ('a', 'b', 'c', 'd')

      - name: current_bundle_id
        tests:
          - accepted_values:
              arguments:
                values: ['BND-01', 'BND-02', 'BND-03', 'BND-04', 'BND-05']
              config:
                where: "current_bundle_id IS NOT NULL"

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_id ~ '^CST-[0-9]{6}$'

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              email ~* '^[A-Za-z0-9._%+-]+@example\.com$'
              AND LENGTH(email) <= 100

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_since::text ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              LOWER(customer_segment) IN ('consumer', 'small business')


# device_models
  - name: dim_device_models
    columns:
      - name: device_id
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['DEV-001', 'DEV-002', 'DEV-003', 'DEV-004',
                         'DEV-005', 'DEV-006', 'DEV-007', 'DEV-008',
                         'DEV-009', 'DEV-010', 'DEV-011', 'DEV-012',
                         'DEV-013', 'DEV-014', 'DEV-015', 'DEV-016',
                         'DEV-017']


# line_usage
  - name: dim_line_usage
    columns:
      - name: usage_id
        tests:
          - not_null
          - unique

      - name: line_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_id ~ '^CST-[0-9]{6}$'


# lines
  - name: dim_lines
    columns:
      - name: line_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: plan_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PLN-01', 'PLN-02', 'PLN-03', 'PLN-04',
                         'PLN-05', 'PLN-06', 'PLN-07', 'PLN-08']

      - name: device_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DEV-001', 'DEV-002', 'DEV-003', 'DEV-004',
                         'DEV-005', 'DEV-006', 'DEV-007', 'DEV-008',
                         'DEV-009', 'DEV-010', 'DEV-011', 'DEV-012',
                         'DEV-013', 'DEV-014', 'DEV-015', 'DEV-016',
                         'DEV-017']

      - name: line_status
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  LOWER(line_status) IN
                  ('active', 'disconnected', 'suspended')

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_id ~ '^CST-[0-9]{6}$'

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              activation_date::text ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              contract_end_date IS NULL
              OR contract_end_date::text ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              masked_phone_number ~ '^\*\*\*-\*\*\*-[0-9]{4}$'


# mobile_plans
  - name: dim_mobile_plans
    columns:
      - name: plan_id
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['PLN-01', 'PLN-02', 'PLN-03', 'PLN-04',
                         'PLN-05', 'PLN-06', 'PLN-07', 'PLN-08']


# service_markets
  - name: dim_service_markets
    columns:
      - name: market_id
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['MKT-01', 'MKT-02', 'MKT-03', 'MKT-04',
                         'MKT-05', 'MKT-06', 'MKT-07', 'MKT-08']

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              state ~* '^[A-Z]{2}$'


# service_products
  - name: dim_service_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['SVC-01', 'SVC-02', 'SVC-03', 'SVC-04',
                         'SVC-05', 'SVC-06', 'SVC-07', 'SVC-08']

      - name: billing_scope
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  LOWER(billing_scope) IN ('account', 'line')

      - name: product_type
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  LOWER(product_type) IN (
                    'home internet',
                    'entertainment',
                    'protection',
                    'add-on',
                    'home services'
                  )


# fact_customer_services
  - name: fact_customer_services
    columns:
      - name: customer_service_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SVC-01', 'SVC-02', 'SVC-03', 'SVC-04',
                         'SVC-05', 'SVC-06', 'SVC-07', 'SVC-08']

    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_service_id ~ '^CSV-[0-9]{6}$'

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_id ~ '^CST-[0-9]{6}$'